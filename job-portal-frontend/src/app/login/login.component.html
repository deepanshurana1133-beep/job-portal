<div class="login-container">
  <div class="login-box">

    <h1>Job Portal</h1>
    <h2>Login</h2>

    <p class="login-subtitle">
      Welcome back! Login to continue your job search.
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit">
        Login
      </button>

      <p
        *ngIf="errorMessage"
        class="error"
      >
        {{ errorMessage }}
      </p>

    </form>

    <div class="register-section">

      <p>New to Job Portal?</p>

      <button
        type="button"
        class="register-btn"
        (click)="goToRegister()"
      >
        Create an Account
      </button>

    </div>

  </div>
</div>
