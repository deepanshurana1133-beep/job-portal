<main class="login-container">
  <a class="auth-brand" routerLink="/welcome" aria-label="Job Portal home">
    <span class="brand-mark" aria-hidden="true">J</span>
    <span>Job Portal</span>
  </a>
  <section class="login-box">
    <span class="auth-eyebrow">WELCOME BACK</span>
    <h1>Sign in to your account</h1>
    <p class="login-subtitle">Continue your job search and keep your applications moving.</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="login-email">Email address</label>
        <input
          id="login-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <p *ngIf="errorMessage" class="error" role="alert">{{ errorMessage }}</p>
      <button type="submit" class="primary-button">Sign in</button>
    </form>

    <div class="register-section">
      <span>New to Job Portal?</span>
      <button type="button" class="text-button" (click)="goToRegister()">Create an account</button>
    </div>
  </section>
  <p class="auth-footer"><a routerLink="/jobs">Browse open jobs</a><span>·</span> Built for your next move</p>
</main>
