<div class="login-container">
  <div class="login-box">
    <h1>Job Portal</h1>
    <h2>Login</h2>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit">Login</button>

      <p *ngIf="errorMessage" class="error">
        {{ errorMessage }}
      </p>
    </form>
  </div>
</div>
