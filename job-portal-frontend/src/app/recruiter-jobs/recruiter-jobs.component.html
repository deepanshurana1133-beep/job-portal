<div class="jobs-container">

  <div class="page-header">

    <div>
      <span class="eyebrow">RECRUITER WORKSPACE</span>
      <h1>My Jobs</h1>
      <p>Manage the jobs you have posted</p>
    </div>

    <div class="header-buttons">
      <button
        class="back-btn"
        (click)="backToDashboard()"
      >
        ← Dashboard
      </button>

      <button
        class="create-btn"
        (click)="createJob()"
      >
        + Create Job
      </button>
    </div>

  </div>

  <div *ngIf="loading" class="loading-state" role="status">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span>Loading your jobs...</span>
  </div>

  <div *ngIf="errorMessage" class="error-message" role="alert">
    {{ errorMessage }}
  </div>

  <div
    *ngIf="!loading && jobs.length === 0 && !errorMessage"
    class="no-jobs"
  >
    <h2>No Jobs Found</h2>
    <p>You haven't created any jobs yet.</p>

    <button
      class="create-btn"
      (click)="createJob()"
    >
      Create Your First Job
    </button>
  </div>

  <div
    class="jobs-grid"
    *ngIf="!loading && jobs.length > 0"
  >

    <div
      class="job-card"
      *ngFor="let job of jobs"
    >

      <div class="job-header">
        <h2>{{ job.title }}</h2>

        <span class="job-type">
          {{ job.jobType }}
        </span>
      </div>

      <p class="job-company">{{ job.company }}</p>
      <div class="job-meta">
        <span>{{ job.location }}</span>
        <span>{{ job.salary }}</span>
      </div>
      <p class="job-description">{{ job.description }}</p>

      <div class="skills">
        <span
          *ngFor="let skill of job.skills"
          class="skill"
        >
          {{ skill }}
        </span>
      </div>

      <div class="job-actions">

        <button
          class="edit-btn"
          (click)="editJob(job._id)"
        >
          Edit
        </button>

        <button
          class="delete-btn"
          (click)="deleteJob(job._id)"
        >
          Delete
        </button>

      </div>

    </div>

  </div>

</div>
