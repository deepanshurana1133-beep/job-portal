<div class="recruiter-jobs-container">

  <h1>My Jobs</h1>
<p *ngIf="errorMessage" class="error">
  {{ errorMessage }}
</p>
  <p *ngIf="jobs.length === 0">
    No jobs found.
  </p>

  <div
    class="job-card"
    *ngFor="let job of jobs"
  >

    <h2>{{ job.title }}</h2>

    <p>
      <strong>Company:</strong>
      {{ job.company }}
    </p>

    <p>
      <strong>Location:</strong>
      {{ job.location }}
    </p>

    <p>
      <strong>Salary:</strong>
      {{ job.salary }}
    </p>

    <p>
      <strong>Job Type:</strong>
      {{ job.jobType }}
    </p>

    <button [routerLink]="['/update-job', job._id]">
  Update
</button>

    <button (click)="deleteJob(job._id)">
  Delete
</button>

  </div>

</div>
