<div class="job-details-container">

  <!-- Error Message -->
  <p
    *ngIf="errorMessage"
    class="error"
  >
    {{ errorMessage }}
  </p>

  <!-- Success Message -->
  <p
    *ngIf="successMessage"
    class="success"
  >
    {{ successMessage }}
  </p>

  <!-- Job Details -->
  <div
    *ngIf="job"
    class="job-details"
  >

    <h1>{{ job.title }}</h1>

    <h3>{{ job.company }}</h3>

    <p>
      <strong>Location:</strong>
      {{ job.location }}
    </p>

    <p>
      <strong>Salary:</strong>
      {{ job.salary }}
    </p>

    <p>
      <strong>Job Type:</strong>
      {{ job.jobType }}
    </p>

    <div>
      <strong>Description:</strong>

      <p>
        {{ job.description }}
      </p>
    </div>

    <div>
      <strong>Skills:</strong>

      <span
        class="skill"
        *ngFor="let skill of job.skills"
      >
        {{ skill }}
      </span>
    </div>

    <hr>

    <!-- Apply Section -->
    <h2>Apply for this Job</h2>

    <label for="resume">
      Upload Resume (PDF)
    </label>

    <input
      id="resume"
      type="file"
      accept="application/pdf"
      (change)="onFileSelected($event)"
    >

    <!-- Selected File -->
    <p *ngIf="selectedFile">

      Selected file:

      <strong>
        {{ selectedFile.name }}
      </strong>

    </p>

    <!-- Apply Button -->
    <button
      (click)="applyForJob()"
      [disabled]="applying"
    >
      {{
        applying
          ? 'Applying...'
          : 'Apply Now'
      }}
    </button>

    <!-- My Applications Button -->
    <div
      *ngIf="showMyApplicationsButton"
      class="my-applications-section"
    >

      <button
        class="my-applications-btn"
        (click)="viewMyApplications()"
      >
        View My Applications
      </button>

    </div>

    <!-- Back Button -->
    <div class="back-section">

      <button
        class="back-btn"
        (click)="goBack()"
      >
        ← Back to Jobs
      </button>

    </div>

  </div>

</div>
