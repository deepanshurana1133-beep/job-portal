<main class="register-container">
  <a class="auth-brand" routerLink="/welcome" aria-label="Job Portal home">
    <span class="brand-mark" aria-hidden="true">J</span>
    <span>Job Portal</span>
  </a>
  <section class="register-box">
    <span class="auth-eyebrow">START YOUR SEARCH</span>
    <h1>Create your account</h1>
    <p class="register-subtitle">Set up your profile to discover and apply for roles that fit.</p>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="register-name">Full name</label>
        <input
          id="register-name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="register-email">Email address</label>
        <input
          id="register-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="register-password">Password</label>
          <input
            id="register-password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Create a password"
            minlength="8"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-confirm-password">Confirm password</label>
          <input
            id="register-confirm-password"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Repeat password"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <p *ngIf="errorMessage" class="error" role="alert">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="success" role="status">{{ successMessage }}</p>
      <button type="submit" class="primary-button">Create account</button>
    </form>

    <div class="login-section">
      <span>Already have an account?</span>
      <button type="button" class="text-button" (click)="goToLogin()">Sign in</button>
    </div>
  </section>
  <p class="auth-footer"><a routerLink="/jobs">Browse open jobs</a><span>·</span> Built for your next move</p>
</main>
