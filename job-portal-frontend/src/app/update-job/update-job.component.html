<div class="update-job-container">

  <button type="button" class="back-btn" (click)="backToJobs()">← Back to my jobs</button>
  <h1>Update Job</h1>

  <div *ngIf="loading" class="loading-state" role="status">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span>Loading job details...</span>
  </div>

  <p *ngIf="message" class="success">
    {{ message }}
  </p>

  <p *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </p>

  <form *ngIf="!loading && !errorMessage" (ngSubmit)="updateJob()">

    <label for="update-title">Job title</label>
    <input
      id="update-title"
      type="text"
      name="title"
      [(ngModel)]="job.title"
      required
    >

    <label for="update-company">Company</label>
    <input
      id="update-company"
      type="text"
      name="company"
      [(ngModel)]="job.company"
      required
    >

    <label for="update-location">Location</label>
    <input
      id="update-location"
      type="text"
      name="location"
      [(ngModel)]="job.location"
      required
    >

    <label for="update-salary">Salary</label>
    <input
      id="update-salary"
      type="text"
      name="salary"
      [(ngModel)]="job.salary"
      required
    >

    <label for="update-job-type">Job type</label>
    <input
      id="update-job-type"
      type="text"
      name="jobType"
      [(ngModel)]="job.jobType"
      required
    >

    <label for="update-description">Description</label>
    <textarea
      id="update-description"
      name="description"
      [(ngModel)]="job.description"
      required
    ></textarea>

    <label for="update-skills">Skills</label>
    <input
      id="update-skills"
      type="text"
      name="skills"
      [(ngModel)]="job.skills"
      placeholder="Angular, TypeScript, HTML"
      required
    >

    <button type="submit" [disabled]="saving">
      {{ saving ? 'Saving changes...' : 'Update Job' }}
    </button>

  </form>

</div>
